name: Build project

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read

jobs:
  build:
    name: Compile and Test
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        rust: ["1.75", "1.94"]  # Rust versions for Yocto Scarthgap and Wrynose
    steps:
      - name: Install system dependencies
        run: >
          sudo apt update
          && sudo apt install --yes --no-install-recommends libdbus-1-dev pkg-config
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ matrix.rust }}
          override: true
          components: rustfmt, clippy
      - name: Check Rust version
        run: rustc --version
      - name: Build
        run: cargo build --features=nongwhw --all --verbose
      - name: Set Timezone
        uses: szenius/set-timezone@1f9716b0f7120e344f0c62bb7b1ee98819aefd42 # v2.0
        with:
          timezoneLinux: "Europe/Zurich"
      - name: Unit tests
        run: cargo test --features=nongwhw --all --verbose
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check Rust format
        run: cargo fmt --all -- --check

  api-tests:
    name: API Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Install system dependencies
        run: >
          sudo apt update
          && sudo apt install --yes --no-install-recommends libdbus-1-dev pkg-config
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.75"
          override: true
      - name: Install Test Server
        run: ./install_test_server.sh
        working-directory: api-tests/tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14
          update-environment: true
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
        with:
          poetry-version: 2.5.1
      - name: Set Timezone
        uses: szenius/set-timezone@1f9716b0f7120e344f0c62bb7b1ee98819aefd42 # v2.0
        with:
          timezoneLinux: "Europe/Zurich"
      - name: Install Python Test Dependencies
        run: poetry install
        working-directory: api-tests
      - name: Run API Tests
        run: poetry run pytest -s --log-cli-level=DEBUG --full-trace
        working-directory: api-tests

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Install system dependencies
        run: >
          sudo apt update
          && sudo apt install --yes --no-install-recommends libdbus-1-dev pkg-config

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cargo-bins/cargo-binstall@422f3094be6a0843857aa008b499caaf6bce0da8 # v1.24.0
        with:
          version: "1.24.0"

      - name: Check Cargo.toml format
        run: |
          cargo binstall cargo-sort@1.0.9 --no-confirm --disable-strategies compile
          cargo sort --check --check-format --grouped

      - name: Find typos
        run: |
          cargo binstall typos-cli@1.29.5 --no-confirm --disable-strategies compile
          typos

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          extra_args: --results=verified,unknown

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
